name: Flux Verify

on:
  push:
    branches: [
      main,
      develop
    ]
  pull_request:
    branches: [
      main,
      develop
    ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build project
        run: ./gradlew build -x test

      - name: Run tests
        run: ./gradlew test

      - name: Verify code test  coverage
        run: ./gradlew koverVerify